[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "abp-estimation-api"
version = "1.0.0"
description = "Flask API for mean arterial blood pressure estimation from PPG and ECG windows"
requires-python = ">=3.9,<3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py39"
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I"]
